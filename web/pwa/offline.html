<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d19" />
    <meta name="color-scheme" content="dark" />
    <title>Offline | OmniVoice Studio</title>
    <style>
      html, body { margin: 0; height: 100%; background: #080d19; color: #f8fafc; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; }
      button {
        min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
        background: #246bfd; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>OmniVoice Studio butuh koneksi internet untuk membuat dan memutar suara. Periksa jaringan Anda, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
