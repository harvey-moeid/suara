version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-tts
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
